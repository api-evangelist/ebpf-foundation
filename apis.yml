aid: ebpf-foundation
name: eBPF Foundation
description: >-
  The eBPF Foundation is a Linux Foundation project that advances eBPF technology by guiding upstream development, promoting its benefits, and enhancing its security and reliability. eBPF enables programmable kernel functionality for networking, observability, tracing, and security without changing kernel source code.
